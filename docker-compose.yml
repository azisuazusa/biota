services:
  app:
    build: .
    image: biota-insight
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      MAX_UPLOAD_MB: "10"
    volumes:
      - biota-data:/data
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  biota-data:
