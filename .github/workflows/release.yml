name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/azisuazusa/biota

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$PRE" == "false" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping: $TAG is not a stable vX.Y.Z release"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ + Tailwind
        run: |
          go install "github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)"
          make tailwind-install

      - name: Generate templ + CSS
        run: make generate

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      - name: go test
        run: go test -count=1 ./...

  build:
    needs: [gate, test]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::error::DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_APPLICATION_ID secrets are required"
            exit 1
          fi

      # Pin the Dokploy application to the exact release image (public GHCR, no credentials).
      - name: Point Dokploy at image
        run: |
          body=$(jq -nc --arg id "$DOKPLOY_APPLICATION_ID" --arg img "$IMAGE:$TAG" \
            '{applicationId: $id, dockerImage: $img, username: "", password: "", registryUrl: ""}')
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/application.saveDockerProvider" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "$body" -o /dev/null -w 'saveDockerProvider HTTP %{http_code}\n'

      - name: Trigger Dokploy deployment
        run: |
          body=$(jq -nc --arg id "$DOKPLOY_APPLICATION_ID" --arg t "Release $TAG" --arg d "$RELEASE_URL" \
            '{applicationId: $id, title: $t, description: $d}')
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "$body" -o /dev/null -w 'deploy HTTP %{http_code}\n'
